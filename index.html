<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Tells mobile browsers (Chrome/Samsung Internet's "Force Dark"/"Simplify page" heuristics)
         that this page already has an intentional dark theme, so they don't try to auto-recolor
         it. This can't override a true OS-level filter (iOS Night Shift, Android Night Light,
         third-party blue-light apps) — those tint the whole screen outside any webpage's reach. -->
    <meta name="color-scheme" content="dark" />
    <title>Timeout Panic</title>
    <link rel="icon" type="image/png" href="/UI/Bomb.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --font-display: 'Baloo 2', system-ui, sans-serif;
        --panel-bg: rgba(22, 16, 48, 0.8);
        --panel-border: #5b4bb8;
        --accent-orange-top: #ffe066;
        --accent-orange-bottom: #ff8800;
        --accent-orange-border: #7a3b12;
        --text-outline: #7a1010;
      }
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;

        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #f2f2f2;

          repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.035) 0 2px, transparent 2px 40px),
          radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.09) 0%, transparent 40%),
          radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.07) 0%, transparent 35%),
          radial-gradient(circle at 25% 85%, rgba(255, 255, 255, 0.06) 0%, transparent 30%),
          radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 30%),

      }
      #lobby {

        flex-direction: column;
        gap: 12px;
        padding: 24px;
        background-color: var(--panel-bg);

          radial-gradient(circle, rgba(255, 255, 255, 0.035) 4%, transparent 5%);
        background-size: 64px 64px, 42px 42px;
        background-position: 0 0, 22px 24px;
        border: 2px solid var(--panel-border);
        border-radius: 16px;
        width: 90vw;
        max-width: 340px;
        box-sizing: border-box;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);

      #main-title-img {
        width: 100%;
        max-width: 300px;
        display: block;
        margin: 0 auto 6px;
      }
      #lobby input,

        padding: 10px 14px;

        border: 1px solid #3a3d4a;
        background: #262936;
        color: #f2f2f2;
        font-size: 15px;
        font-family: inherit;
      }
      #lobby button {
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #3a3d4a;
        cursor: pointer;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
      }
      .btn-primary,
      .btn-secondary {
        min-height: 46px;
      }
      .btn-primary {
        background: linear-gradient(180deg, var(--accent-orange-top) 0%, var(--accent-orange-bottom) 100%);
        border: 3px solid var(--accent-orange-border) !important;
        color: #7a2000;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 0 var(--accent-orange-border), 0 6px 10px rgba(0, 0, 0, 0.3);
        transition: transform 0.05s ease;
      }
      .btn-primary:hover {
        background: linear-gradient(180deg, #fff2b8 0%, #ff9d1f 100%);
        box-shadow: 0 5px 0 var(--accent-orange-border), 0 8px 14px rgba(0, 0, 0, 0.35);
      }
      .btn-primary:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 var(--accent-orange-border);
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: 0 4px 0 var(--accent-orange-border), 0 6px 10px rgba(0, 0, 0, 0.3);

      .btn-secondary {
        background: rgba(255, 255, 255, 0.08) !important;
        border: 2px solid var(--panel-border) !important;
        color: #f2f2f2 !important;

      .btn-secondary:hover {

      }

      #entry-actions-row {
        display: flex;
        justify-content: center;

      }

      #avatar-row {

      #avatar-actions {

        flex-direction: column;

      #avatar-actions button {

      #room-code-copy-btn {

      }

      #duration-row {

      #duration-stepper {

      #duration-stepper button {

        min-height: 0;
        padding: 5px;

        border-radius: 50%;

      #duration-stepper button img {

      #duration-stepper button:disabled {

      }
      #duration-value {
        font-family: var(--font-display);

        min-width: 40px;

      }
      #zip-settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #zip-enabled-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;

      }
      #zip-enabled-checkbox {

        height: 16px;
        accent-color: var(--accent-orange-bottom);
        cursor: pointer;
      }
      #tutorial-settings-row {
        display: flex;
        align-items: center;
      }
      #tutorial-enabled-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #cfc9f0;
        cursor: pointer;
      }
      #tutorial-enabled-checkbox {
        width: 16px;
        height: 16px;
        accent-color: var(--accent-orange-bottom);
        cursor: pointer;
      }
      #zip-duration-stepper {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #zip-duration-stepper button {
        width: 24px;
        height: 24px;
        min-height: 0;
        padding: 4px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        cursor: pointer;
      }
      #zip-duration-stepper button img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #zip-duration-stepper button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      #zip-duration-value {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        min-width: 32px;
        text-align: center;
      }
      #streak-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #streak-row label {
        font-size: 13px;
        color: #cfc9f0;
      }
      #streak-stepper {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #streak-stepper button {
        width: 24px;
        height: 24px;
        min-height: 0;
        padding: 4px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        cursor: pointer;
      }
      #streak-stepper button img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #streak-stepper button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      #streak-value {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        min-width: 14px;
        text-align: center;
      }
      #difficulty-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #difficulty-row label {
        font-size: 13px;
        color: #cfc9f0;
      }
      #difficulty-selector {
        display: flex;
        gap: 4px;
      }
      #difficulty-selector button {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 11px;
        padding: 5px 9px;
        min-height: 0;
        border-radius: 10px;
        border: 2px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.06);
        color: #cfc9f0;
        cursor: pointer;
      }
      #difficulty-selector button.active {
        background: linear-gradient(180deg, var(--accent-orange-top) 0%, var(--accent-orange-bottom) 100%);
        border-color: var(--accent-orange-border);
        color: #7a2000;
      }
      #game-over-shield-img {
        width: 64px;
        margin-top: -8px;
      }
      #client-waiting {
        font-size: 14px;
        color: #cfc9f0;
      }
      #game-over-waiting {
        font-size: 14px;
        color: #cfc9f0;
        text-align: center;
      }
      .hidden {
        display: none !important;
      }
      #game-container {
        position: relative;
        /* Fills as much of the window as it can without overflowing either dimension: whichever
           is smaller of 96% of the width, or the width that keeps the 8:5 card at 90% of the
           height. Desktop used to stay pinned to a small 800px box regardless of window size —
           this makes it scale up the same way phones already get the full viewport. */
        width: min(96vw, calc(90vh * 8 / 5));
        aspect-ratio: 800 / 500;
        line-height: 0;
        border-radius: 12px;
        overflow: hidden;
      }
      /* Portrait phones: the 800x500 landscape ratio above would squash the board into a thin
         strip and starve the puzzle overlays of height, forcing them to scroll. Let the
         container use the real viewport instead — Phaser's FIT scale mode still letterboxes the
         800x500 board correctly within whatever shape we give it. */
      @media (max-width: 700px) and (orientation: portrait) {
        #game-container {
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          max-width: none;
          aspect-ratio: auto;
          border-radius: 0;
        }
      }
      #elimination-toast {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%) translateY(-10px);
        background-image: url('/UI/Sprites/TicketCardOrangeGlowLandscape.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        padding: 18px 34px;
        font-family: var(--font-display);
        font-weight: 800;
        color: #3a1400;
        font-size: 15px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
        z-index: 5;
      }
      #elimination-toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #turn-notice-toast {
        position: absolute;
        top: 120px;
        left: 50%;
        transform: translateX(-50%) translateY(-10px);
        background-image: url('/UI/Sprites/TicketCardOrangeGlowLandscape.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        padding: 14px 30px;
        font-family: var(--font-display);
        font-weight: 800;
        color: #3a1400;
        font-size: 13px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
        z-index: 5;
      }
      #turn-notice-toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #zip-overlay,
      #shop-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 10, 14, 0.55);
        z-index: 10;
      }
      /* The active holder's own puzzle escapes the letterboxed spectator-board card entirely and
         covers the real device screen (position:fixed, not absolute-within-#game-container) — the
         puzzle needs the biggest usable space, and the board behind it is irrelevant while
         solving. This is a real full-page view, not a popup over a dimmed backdrop — hence the
         opaque background (matches body's) instead of a translucent scrim, and no
         align-items/justify-content centering: .puzzle-page (built by mountPuzzleOverlay) fills
         it edge to edge. container-type:size lives here (moved from #game-container) so
         .puzzle-page's cqmin/cqh-based sizing measures against the true viewport instead of the
         smaller letterboxed card. Zip/Shop stay boxed in the card (unchanged above) as real
         popups — only the holder's own solving view needs to go full-screen. */
      #puzzle-overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: flex;
        background: linear-gradient(180deg, #3b4cca 0%, #6a2fb0 55%, #7a2fb0 100%);
        z-index: 100;
        container-type: size;
      }
      /* Tutorial Mode's practice loop — same full-screen treatment as #puzzle-overlay (it's the
         same underlying puzzle mount, just in practiceMode), plus a persistent ready/skip action
         bar that survives each puzzle re-mount underneath it. */
      #tutorial-panel {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #3b4cca 0%, #6a2fb0 55%, #7a2fb0 100%);
        z-index: 100;
        container-type: size;
      }
      /* mountPuzzleOverlay clears and rebuilds whatever containerEl it's given each call —
         display:contents keeps this div out of the layout box entirely, so the .puzzle-page it
         builds becomes a direct flex child of #tutorial-panel, sized to fill everything above the
         persistent #tutorial-actions bar below it, without an extra wrapping box. */
      #tutorial-puzzle-mount {
        display: contents;
      }
      #tutorial-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        flex-shrink: 0;
        padding: 8px 14px 14px;
        box-sizing: border-box;
      }
      #tutorial-ready-count {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        color: #cfc9f0;
      }
      #points-balance {
        position: absolute;
        top: 60px;
        right: 14px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 10px;
        border-radius: 14px;
        background: rgba(10, 10, 14, 0.6);
        border: 1px solid var(--accent-orange-border);
        color: #ffdd55;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13px;
        z-index: 8;
      }
      #points-balance img {
        width: 16px;
        height: 16px;
        object-fit: contain;
      }
      #waiting-actions-row {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 8;
      }
      #throw-tomato-btn,
      #shop-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 24px;
        border: 2px solid var(--accent-orange-border);
        background: linear-gradient(180deg, var(--accent-orange-top) 0%, var(--accent-orange-bottom) 100%);
        color: #7a2000;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 4px 0 var(--accent-orange-border), 0 6px 14px rgba(0, 0, 0, 0.35);
      }
      #throw-tomato-btn img,
      #shop-btn img {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }
      #throw-tomato-btn:hover,
      #shop-btn:hover {
        filter: brightness(1.08);
      }
      #throw-tomato-btn:active,
      #shop-btn:active {
        transform: translateY(2px);
      }
      #throw-tomato-btn {
        animation: tomato-btn-pulse 1.6s ease-in-out infinite;
      }
      #shop-btn {
        background: linear-gradient(180deg, #fff3c4 0%, #f4c430 100%);
        border-color: #7a5a12;
      }
      @keyframes tomato-btn-pulse {
        0%,
        100% {
          box-shadow: 0 4px 0 var(--accent-orange-border), 0 6px 14px rgba(0, 0, 0, 0.35);
        }
        50% {
          box-shadow: 0 4px 0 var(--accent-orange-border), 0 6px 22px rgba(255, 140, 0, 0.7);
        }
      }
      .tomato-stain {
        position: absolute;
        width: 90px;
        height: 90px;
        object-fit: contain;
        pointer-events: none;
        z-index: 20;
        animation: tomato-splat 0.25s ease;
      }
      @keyframes tomato-splat {
        0% {
          transform: scale(0.3) rotate(calc(var(--tomato-rot, 0deg) - 30deg));
          opacity: 0;
        }
        60% {
          transform: scale(1.15) rotate(calc(var(--tomato-rot, 0deg) + 15deg));
          opacity: 1;
        }
        100% {
          transform: scale(1) rotate(var(--tomato-rot, 0deg));
          opacity: 1;
        }
      }
      .confetti-piece {
        position: absolute;
        top: -20px;
        width: 8px;
        height: 14px;
        border-radius: 2px;
        opacity: 0.95;
        pointer-events: none;
        z-index: 30;
        animation: confetti-fall var(--fall-duration, 1.8s) ease-in forwards;
      }
      @keyframes confetti-fall {
        0% {
          transform: translate(0, 0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translate(var(--drift, 0px), 480px) rotate(var(--spin, 360deg));
          opacity: 0;
        }
      }
      .explosion-particle {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff6c8 0%, #ffb347 45%, #ff4d00 80%);
        box-shadow: 0 0 6px 2px rgba(255, 120, 0, 0.6);
        pointer-events: none;
        z-index: 30;
        animation: explosion-burst 0.5s ease-out forwards;
      }
      @keyframes explosion-burst {
        0% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, 0px))) scale(0.3);
          opacity: 0;
        }
      }
      .puzzle-panel {
        /* 80cqmin reproduces the old flat 300px cap at the old default container size (was
           800x500, cqmin 500 -> 80% = 400px, close enough with the visual padding already in
           play) and on a portrait phone (cqmin = the narrower width there) — but then actually
           keeps growing on a big desktop window instead of hitting that same flat ceiling. */
        width: min(88%, 80cqmin);
        max-height: 92%;
        /* Content is sized to shrink and fit (clamp()/vh-based children below) rather than rely
           on this — kept only as a last-resort safety net so nothing ever gets unreadably cut
           off if a future puzzle's content is taller than expected. */
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        min-height: 0;
        padding: 14px 14px 10px;
        border-radius: 20px;
        border: 2px solid var(--panel-border);
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.07) 8%, transparent 9%),
          radial-gradient(circle, rgba(255, 255, 255, 0.045) 4%, transparent 5%),
          url('/UI/Sprites/background_bp_Gradinet.png');
        background-size: 56px 56px, 36px 36px, 100% 100%;
        background-position: 0 0, 18px 20px, center;
        background-repeat: repeat, repeat, no-repeat;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        box-sizing: border-box;
        position: relative;
      }
      /* The active holder's real puzzle screen — a genuine full page (built by
         mountPuzzleOverlay into #puzzle-overlay/#tutorial-panel), not a floating card. Title at
         top, fuse timer + streak dots below it, then the framed .puzzle-game-box takes whatever
         vertical room is left, then a small footer logo. .puzzle-panel (above) is unrelated —
         that one's still the floating-card look used by real popups (How-to-Play, Avatar
         Creator). */
      .puzzle-page {
        width: 100%;
        height: 100%;
        max-width: min(100%, 720px);
        margin: 0 auto;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px 14px 10px;
        box-sizing: border-box;
      }
      .puzzle-header {
        flex-shrink: 0;
      }
      /* The one part of the page with a distinct framed background — everything else (title,
         fuse timer, dots, footer logo) sits directly on the page background. Takes whatever
         vertical space isn't used by that chrome, so it's always the dominant element on screen. */
      .puzzle-game-box {
        width: 100%;
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        border: 2px solid var(--panel-border);
        background-color: var(--panel-bg);
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.07) 8%, transparent 9%),
          radial-gradient(circle, rgba(255, 255, 255, 0.045) 4%, transparent 5%),
          url('/UI/Sprites/background_bp_Gradinet.png');
        background-size: 56px 56px, 36px 36px, 100% 100%;
        background-position: 0 0, 18px 20px, center;
        background-repeat: repeat, repeat, no-repeat;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        box-sizing: border-box;
        padding: 14px;
        /* Last-resort safety net, same role as .puzzle-panel's own overflow-y:auto — puzzle
           content is sized via real-geometry measurement now specifically so this never has to
           trigger, but overflow:hidden previously turned an over-tall measurement into silently
           vanished content (the prompt text got clipped off) instead of a visible, scrollable one. */
        overflow-y: auto;
        overflow-x: hidden;
        position: relative;
      }
      .puzzle-banner {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 14px;
        background: repeating-linear-gradient(135deg, #ff8800, #ff8800 10px, #e67300 10px, #e67300 20px);
        border: 3px solid var(--accent-orange-border);
        box-sizing: border-box;
      }
      .puzzle-banner img {
        height: clamp(28px, 8cqmin, 52px);
        display: block;
      }
      .puzzle-title-text {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(20px, 7cqmin, 34px);
        color: #fff5cc;
        text-shadow: 2px 2px 0 var(--text-outline), -2px -2px 0 var(--text-outline), 2px -2px 0 var(--text-outline),
          -2px 2px 0 var(--text-outline);
      }
      .puzzle-timer {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(12px, 3.5cqmin, 20px);
        color: #fff5cc;
        text-shadow: 1px 1px 0 var(--text-outline), -1px -1px 0 var(--text-outline);
        white-space: nowrap;
        pointer-events: none;
        z-index: 2;
      }
      .puzzle-fuse-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        box-sizing: border-box;
        padding: 0 2px;
      }
      .puzzle-fuse-bomb {
        width: clamp(20px, 6cqmin, 44px);
        height: clamp(20px, 6cqmin, 44px);
        flex-shrink: 0;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
      }
      .puzzle-fuse-rope {
        flex: 1;
        height: clamp(14px, 4cqmin, 26px);
        border-radius: 8px;
        background: repeating-linear-gradient(50deg, #a5763f 0 4px, #7d5527 4px 8px);
        border: 2px solid #4a2f14;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
        overflow: visible;
        position: relative;
      }
      .puzzle-fuse-burnt {
        position: absolute;
        top: -2px;
        bottom: -2px;
        right: -2px;
        width: 0%;
        border-radius: 0 8px 8px 0;
        background: linear-gradient(270deg, #100804 0%, #291607 85%, #472305 100%);
        transition: width 0.2s linear;
      }
      .puzzle-fuse-spark {
        position: absolute;
        top: 50%;
        left: 0%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, #fff6c8 0%, #ffb347 45%, #ff4d00 75%, transparent 100%);
        box-shadow: 0 0 9px 4px rgba(255, 140, 0, 0.85);
      }
      .puzzle-dots {
        display: flex;
        gap: 10px;
      }
      .puzzle-dot {
        width: clamp(10px, 4cqmin, 28px);
        height: clamp(10px, 4cqmin, 28px);
        border-radius: 50%;
        background: #5a1414;
        border: 2px solid rgba(255, 255, 255, 0.35);
        box-sizing: border-box;
        flex-shrink: 0;

      .puzzle-dot.filled {

      .puzzle-content {

           doesn't push its rendered height past this element's 100% and silently overflow

        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        position: relative;
        min-height: 0;
        flex-shrink: 1;

         not a floating card that needed its own branding to feel complete. */
      .puzzle-footer-logo {

        margin-top: 2px;
        flex-shrink: 0;

      /* First thing to go on a short viewport (landscape phones, or a tall difficulty-scaled

      @media (max-height: 560px) {

      .zip-panel,

        background-image:

        background-size: 56px 56px, 36px 36px, 100% 100%;
        background-position: 0 0, 18px 20px, center;

      @media (max-width: 700px) and (orientation: portrait) {

      .stroop-word {
        font-family: var(--font-display);
        font-weight: 800;
        /* Was a flat 30px — didn't grow with the puzzle panel at all. cqmin-scaled like
           everything else in the panel so it actually fills the extra room on a full-screen
           overlay instead of leaving dead space above the (also now bigger) swatch grid. */
        font-size: clamp(26px, 12cqmin, 72px);
        line-height: 1.2;
        margin-top: 2px;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35);
      }
      .stroop-grid {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        justify-items: center;
        align-items: center;
        gap: 10px;
      }
      .stroop-btn {
        /* width/height are set inline per-swatch by Stroop.js (real-geometry measurement of the
           actual leftover space after the prompt/word text) so they're always square and never
           taller than the room available — a CSS-only percentage couldn't know how much of the
           page the surrounding chrome (title/timer/dots/logo) was already using. */
        border-radius: 10px;
        border: 3px solid rgba(0, 0, 0, 0.35);
        cursor: pointer;
        box-sizing: border-box;
      }
      /* Generic "pick one of N" building block for new minigames — a styled, on-brand grid of
         tap targets so a new puzzle never has to invent its own one-off button styling from
         scratch. See tools/mod-tool/DESIGN_GUIDELINES.md. Click-only (no drag needed), works
         identically on mouse and touch with zero extra plumbing. */
      .puzzle-option-grid {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .puzzle-option-btn {
        /* Text content, not an icon — sized to fit its label rather than stretched to fill
           space: a modest, comfortably-tappable height that scales gently with the screen, not
           a tall rectangle. Free to be wide (grid column width), just not tall. */
        min-height: clamp(50px, 12cqh, 90px);
        padding: 8px 10px;
        border-radius: 12px;
        border: 3px solid var(--accent-orange-border);
        background: linear-gradient(180deg, var(--accent-orange-top) 0%, var(--accent-orange-bottom) 100%);
        color: #7a2000;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: clamp(16px, 4cqmin, 24px);
        text-align: center;
        cursor: pointer;
        box-shadow: 0 3px 0 var(--accent-orange-border);
        transition: transform 0.05s ease;

      .puzzle-option-btn:hover {
        filter: brightness(1.08);
      }
      .puzzle-option-btn:active {
        transform: translateY(2px);

      .swipe-zone {
        /* width/height/font-size are set inline by Swipe.js (real-geometry measurement of the
           leftover space after the prompt text) — see Stroop.js's identical fix for why a
           page-wide cqh percentage isn't safe here. */
        border-radius: 14px;
        border: 3px dashed rgba(255, 255, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        color: rgba(255, 255, 255, 0.7);
        touch-action: none;
        user-select: none;
        box-sizing: border-box;

      .mole-grid {
        /* Cell size (grid-template-columns/grid-auto-rows) is set from JS at mount time
           (WhackAMole.js), the same real-geometry approach ZipPuzzle.js already uses — it reads
           the container's actual width and a viewport-height budget directly, rather than
           fighting CSS aspect-ratio/flex interactions to derive a size that's correct for any
           gridSize (difficulty presets range from 6 to 12+ holes). */
        display: grid;

        40% {
          transform: translate(8px, -4px);

        border: none;
        background: url('/UI/Sprites/IconCloseXRed.png') center / contain no-repeat;
        cursor: pointer;
        z-index: 2;
      }
      .modal-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 20px;
        color: #ffdd55;
        text-shadow: 1px 1px 0 var(--text-outline);
      }
      #join-modal-status {
        min-height: 18px;
        font-size: 13px;
        color: #cfc9f0;
        text-align: center;
      }
      .avatar-creator-panel {
        max-width: 320px;
      }
      #how-to-play-row {
        display: flex;
        justify-content: center;
        width: 100%;
      }
      #how-to-play-btn {
        min-height: 0;
        padding: 4px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--panel-border);
        color: #cfc9f0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
      }
      #how-to-play-btn:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      #how-to-play-btn:active {
        transform: translateY(1px);
      }
      .how-to-play-panel {
        max-width: 360px;
      }
      .rule-page {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        min-height: 200px;
        justify-content: center;
        text-align: center;
      }
      .rule-page-icon {
        width: 64px;
        height: 64px;
        object-fit: contain;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.45));
      }
      .rule-page-icon-emoji {
        width: 64px;
        height: 64px;
        font-size: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .rule-page-title {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 19px;
        color: #ffdd55;
        text-shadow: 1px 1px 0 var(--text-outline);
      }
      .rule-page-text {
        font-size: 15px;
        line-height: 1.5;
        color: #f2f2f2;
      }
      #how-to-play-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        width: 100%;
      }
      .how-to-play-arrow-btn {
        width: 34px;
        height: 34px;
        min-height: 0;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        color: #fff5cc;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }
      .how-to-play-arrow-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .catch-zone {
        position: relative;
        width: 100%;
        height: 240px;
        border-radius: 14px;
        border: 2px solid var(--panel-border);
        background: rgba(0, 0, 0, 0.28);
        overflow: hidden;
        touch-action: none;
      }
      .falling-item {
        position: absolute;
        width: 40px;
        height: 40px;
        object-fit: contain;
        pointer-events: none;
      }
      .falling-item-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 2px dashed rgba(255, 255, 255, 0.5);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 9px;
        color: rgba(255, 255, 255, 0.75);
        text-align: center;
        box-sizing: border-box;
      }
      .catch-basket {
        position: absolute;
        bottom: 8px;
        width: 64px;
        height: 36px;
        background: linear-gradient(180deg, var(--accent-orange-top), var(--accent-orange-bottom));
        border: 3px solid var(--accent-orange-border);
        border-radius: 0 0 16px 16px;
        transform: translateX(-50%);
        pointer-events: none;
      }
      .avatar-creator-actions {
        display: flex;
        gap: 10px;
        width: 100%;
      }
      .avatar-creator-actions button {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="lobby">
      <img id="main-title-img" src="/UI/Main Title.png" alt="Timeout Panic - Pass or Blast" />

      <div id="entry">
        <div id="avatar-row">
          <div id="avatar-preview" class="avatar-stack avatar-preview-lg"></div>
          <div id="avatar-actions">
            <button id="avatar-random-btn" title="Random avatar">
              <img src="/UI/Sprites/RandomCard.png" alt="" />
            </button>
            <button id="avatar-customize-btn" title="Customize avatar">✏️</button>
          </div>
        </div>
        <input id="name-input" maxlength="14" placeholder="Your name" />
        <div id="entry-actions-row">
          <button id="host-btn" class="btn-primary">Host Game</button>
          <button id="join-btn" class="btn-primary">Join Game</button>
        </div>
        <div id="how-to-play-row">
          <button id="how-to-play-btn" type="button">How to Play</button>
        </div>
      </div>

      <div id="room" class="hidden">
        <div id="room-code-display">
          <span id="room-code-text"></span>
          <button id="room-code-copy-btn" type="button" title="Copy room code">📋</button>
        </div>
        <ul id="player-list"></ul>

        <div id="host-controls" class="hidden">
          <div id="duration-row">
            <label>Match length</label>
            <div id="duration-stepper">
              <button id="duration-minus-btn" type="button" title="Shorter">
                <img src="/UI/Sprites/IconMinusFlatRed.png" alt="-" />
              </button>
              <span id="duration-value">60s</span>
              <button id="duration-plus-btn" type="button" title="Longer">
                <img src="/UI/Sprites/IconPlusFlatGreen.png" alt="+" />
              </button>
            </div>
          </div>
          <div id="zip-settings-row">
            <label id="zip-enabled-label">
              <input type="checkbox" id="zip-enabled-checkbox" checked />
              Tomato sabotage
            </label>
            <div id="zip-duration-stepper">
              <button id="zip-duration-minus-btn" type="button" title="Shorter">
                <img src="/UI/Sprites/IconMinusFlatRed.png" alt="-" />
              </button>
              <span id="zip-duration-value">1.5s</span>
              <button id="zip-duration-plus-btn" type="button" title="Longer">
                <img src="/UI/Sprites/IconPlusFlatGreen.png" alt="+" />
              </button>
            </div>
          </div>
          <div id="streak-row">
            <label>Streak to pass</label>
            <div id="streak-stepper">
              <button id="streak-minus-btn" type="button" title="Fewer">
                <img src="/UI/Sprites/IconMinusFlatRed.png" alt="-" />
              </button>
              <span id="streak-value">3</span>
              <button id="streak-plus-btn" type="button" title="More">
                <img src="/UI/Sprites/IconPlusFlatGreen.png" alt="+" />
              </button>
            </div>
          </div>
          <div id="difficulty-row">
            <label>Difficulty</label>
            <div id="difficulty-selector">
              <button type="button" data-level="easy">Easy</button>
              <button type="button" data-level="medium">Medium</button>
              <button type="button" data-level="hard">Hard</button>
            </div>
          </div>
          <div id="tutorial-settings-row">
            <label id="tutorial-enabled-label">
              <input type="checkbox" id="tutorial-enabled-checkbox" />
              Tutorial Mode (untimed practice round first)
            </label>
          </div>
          <button id="start-btn" class="btn-primary" disabled>Start Game</button>
        </div>

        <div id="client-waiting" class="hidden"></div>

        <button id="leave-room-btn" class="btn-secondary" type="button">Leave Room</button>
      </div>

      <div id="lobby-status"></div>
    </div>

    <div id="tutorial-panel" class="hidden">
      <div id="tutorial-puzzle-mount"></div>
      <div id="tutorial-actions">
        <span id="tutorial-ready-count"></span>
        <button id="tutorial-ready-btn" class="btn-primary" type="button">✅ I'm Ready!</button>
        <button id="tutorial-skip-btn" class="btn-secondary hidden" type="button">Skip Tutorial</button>
      </div>
    </div>

    <div id="game-container" class="hidden">
      <div id="elimination-toast"></div>
      <div id="turn-notice-toast"></div>
      <div id="puzzle-overlay" class="hidden"></div>

      <div id="points-balance" class="hidden">
        <img src="/UI/Sprites/IconCoinGold.png" alt="" />
        <span id="points-balance-value">0</span>
      </div>

      <div id="waiting-actions-row">
        <button id="throw-tomato-btn" type="button" class="hidden">
          <img src="/UI/Sprites/Tomato_Stain.png" alt="" />
          Throw Tomato
        </button>
        <button id="shop-btn" type="button" class="hidden">
          <img src="/UI/Sprites/IconShop.png" alt="" />
          Shop
        </button>
      </div>

      <div id="zip-overlay" class="hidden">
        <button id="zip-cancel-btn" class="modal-close-btn" title="Cancel"></button>
      </div>

      <div id="shop-overlay" class="hidden">
        <div class="shop-panel">
          <button id="shop-cancel-btn" class="modal-close-btn" title="Close"></button>
          <div class="modal-title">Shop</div>
          <div class="shop-balance">
            <img src="/UI/Sprites/IconCoinGold.png" alt="" />
            <span id="shop-balance-value">0</span>
          </div>
          <div class="shop-items">
            <button class="shop-item-btn" id="shop-buy-fuseTime" data-item="fuseTime" type="button">
              <span class="shop-item-icon">⏱️</span>
              <span class="shop-item-label">+<span id="shop-fuse-seconds"></span>s Fuse Time<br /><small>for your next turn</small></span>
              <span class="shop-item-price">
                <img src="/UI/Sprites/IconCoinGold.png" alt="" />
                <span id="shop-price-fuseTime"></span>
              </span>
            </button>
            <button class="shop-item-btn" id="shop-buy-throwTomato" data-item="throwTomato" type="button">
              <span class="shop-item-icon">🍅</span>
              <span class="shop-item-label">Throw Tomato Now</span>
              <span class="shop-item-price">
                <img src="/UI/Sprites/IconCoinGold.png" alt="" />
                <span id="shop-price-throwTomato"></span>
              </span>
            </button>
            <button class="shop-item-btn" id="shop-buy-skipPass" data-item="skipPass" type="button">
              <span class="shop-item-icon">⏭️</span>
              <span class="shop-item-label">Skip-Ahead Pass<br /><small>auto-completes your next turn</small></span>
              <span class="shop-item-price">
                <img src="/UI/Sprites/IconCoinGold.png" alt="" />
                <span id="shop-price-skipPass"></span>
              </span>
            </button>
          </div>
        </div>
      </div>
      <div id="game-over-panel" class="hidden">
        <img id="game-over-loss-img" class="hidden" src="/UI/blewup.png" alt="You blew up" />
        <div id="game-over-title" class="hidden"></div>
        <img id="game-over-shield-img" class="hidden" src="/UI/Sprites/Sheild.png" alt="" />
        <div id="game-over-wins" class="hidden"></div>
        <div id="game-over-stats" class="hidden"></div>
        <button id="play-again-btn" class="btn-primary hidden">Next Round</button>
        <div id="game-over-waiting" class="hidden">Waiting for host to start the next round...</div>
      </div>
    </div>

    <div id="join-modal" class="modal-overlay hidden">
      <div class="puzzle-panel">
        <button id="join-modal-x-btn" class="modal-close-btn" title="Close"></button>
        <div class="modal-title">Join Game</div>
        <input id="join-code" maxlength="4" placeholder="CODE" />
        <button id="join-confirm-btn" class="btn-primary">Join</button>
        <div id="join-modal-status"></div>
        <button id="join-modal-close-btn" class="btn-secondary">Cancel</button>
      </div>
    </div>

    <div id="avatar-creator-modal" class="modal-overlay hidden">
      <div class="puzzle-panel avatar-creator-panel">
        <button id="avatar-creator-x-btn" class="modal-close-btn" title="Close"></button>
        <div class="modal-title">Customize Avatar</div>
        <div id="avatar-creator-preview" class="avatar-stack avatar-preview-lg"></div>
        <div id="catch-zone" class="catch-zone">
          <div id="catch-basket" class="catch-basket"></div>
        </div>
        <div class="avatar-creator-actions">
          <button id="avatar-save-btn" class="btn-primary">Save</button>
          <button id="avatar-cancel-btn" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <div id="how-to-play-modal" class="modal-overlay hidden">
      <div class="puzzle-panel how-to-play-panel">
        <button id="how-to-play-x-btn" class="modal-close-btn" title="Close"></button>
        <div class="modal-title">How to Play</div>
        <div id="rule-page" class="rule-page"></div>
        <div id="how-to-play-nav">
          <button id="how-to-play-prev-btn" class="how-to-play-arrow-btn" type="button" title="Previous">‹</button>
          <div id="how-to-play-dots" class="puzzle-dots"></div>
          <button id="how-to-play-next-btn" class="how-to-play-arrow-btn" type="button" title="Next">›</button>
        </div>
        <button id="how-to-play-close-btn" class="btn-primary">Got it!</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
